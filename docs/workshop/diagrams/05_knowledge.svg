<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">원자료와 파생 지식 및 사람 검토를 연결하는 뉴스룸 지식 관리 제안</title><desc id="desc">원자료와 파생 지식 및 사람 검토를 연결하는 뉴스룸 지식 관리 제안. 자세한 논리 구조는 같은 이름의 Mermaid 파일에 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626262"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="60" y="74" font-size="40" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">취재 지식은 원자료와 해석을 연결해 쌓을 수 있습니다</tspan></text><text x="60" y="124" font-size="23" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">향후 뉴스룸 확장 제안 · 현재 웹앱에 Wiki나 조직 저장 기능을 구현했다는 뜻은 아님</tspan></text><rect x="60" y="230" width="430" height="265" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="273" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">원자료 보존</tspan></text><text x="84" y="317" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">공시 · 통계 · 허용된 취재 기록</tspan><tspan x="84" dy="35">원문 위치 · 기준 시점 · 버전</tspan><tspan x="84" dy="35">모델이 원본을 덮어쓰지 않음</tspan></text><rect x="585" y="230" width="430" height="265" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="609" y="273" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="609" dy="0">출처를 연결한 파생 지식</tspan></text><text x="609" y="317" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="609" dy="0">기업 · 주제 · 사건별 노트</tspan><tspan x="609" dy="35">요약 · 상충하는 주장 · 변경</tspan><tspan x="609" dy="35">원자료로 돌아가는 연결</tspan></text><rect x="1110" y="230" width="430" height="265" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="1134" y="273" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="1134" dy="0">사람 검토와 활용</tspan></text><text x="1134" y="317" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="1134" dy="0">브리핑 · 후속 취재 질문</tspan><tspan x="1134" dy="35">검토자 · 상태 · 판단 이유</tspan><tspan x="1134" dy="35">데스크 인계와 재사용</tspan></text><polyline points="490,355 585,355" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1015,355 1110,355" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1330,495 1330,565 275,565 275,495" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="570" y="549" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="570" dy="0">미해결 질문 → 추가 자료 확보</tspan></text><text x="60" y="650" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">Second Brain: 수집·정리·요약·활용의 방법론</tspan></text><text x="60" y="698" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">LLM Wiki: 원자료를 바탕으로 연결된 문서를 유지하는 패턴</tspan></text><text x="60" y="772" font-size="25" font-weight="400" fill="#191919" text-anchor="start"><tspan x="60" dy="0">뉴스룸의 추가 설계: 접근 권한 · 출처 추적 · 정정 반영 · 검토 책임 · 갱신 이력</tspan></text><text x="60" y="840" font-size="24" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">모델의 요약은 새 독립 근거가 아닙니다. 원자료와 검토 상태를 함께 유지합니다.</tspan></text></g></svg>
