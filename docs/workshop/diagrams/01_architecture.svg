points="370,350 435,350" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="373" y="327" font-size="18" font-weight="400" fill="#191919" text-anchor="start"><tspan x="373" dy="0">HTTPS</tspan></text><polyline points="435,485 370,485" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="775,355 775,390" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="775,535 775,580" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1080,420 1158,420 1158,265 1210,265" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1210,310 1180,310 1180,650 1080,650" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1080,475 1210,475" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1210,505 1080,505" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1210,670 1135,670 1135,755 1115,755" fill="none" stroke="#626262" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="60" y="823" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="60" dy="0">로컬: Vite와 FastAPI 두 프로세스   |   배포: 정적 웹 파일과 API를 함께 제공</tspan></text><text x="60" y="863" font-size="22" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">브라우저에서 React 실행 · Cloud Build → Artifact Registry → Cloud Run · 승인 후에만 수치 조회</tspan></text></g></svg>
