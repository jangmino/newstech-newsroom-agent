<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">프론트엔드와 백엔드 및 공급자의 역할 구성도</title><desc id="desc">프론트엔드와 백엔드 및 공급자의 역할 구성도. 자세한 논리 구조는 같은 이름의 Mermaid 파일에 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626262"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="60" y="74" font-size="40" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">화면과 서버의 역할을 나누고 한 서비스로 배포합니다</tspan></text><text x="60" y="124" font-size="23" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">현재 앱 구조 · 외부 API와 비밀값은 서버에서만 사용</tspan></text><rect x="435" y="180" width="680" height="595" fill="white" stroke="#235CBB" stroke-width="2"/><text x="460" y="220" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="460" dy="0">Cloud Run · FastAPI 한 컨테이너</tspan></text><rect x="60" y="305" width="310" height="200" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="348" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">참가자 브라우저</tspan></text><text x="84" y="392" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">React · TypeScript</tspan><tspan x="84" dy="35">질문 · 승인 · 사람 검토</tspan></text><rect x="470" y="255" width="610" height="100" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="494" y="298" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="494" dy="0">웹 정적 파일 + 실습 API</tspan></text><text x="494" y="342" font-size="24" font-weight="400" fill="#191919" text-anchor="start"></text><rect x="470" y="390" width="610" height="145" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="494" y="433" font-