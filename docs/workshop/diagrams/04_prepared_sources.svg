<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">D와 E의 사전 자료 준비와 승인 후 브리핑 생성</title><desc id="desc">D와 E의 사전 자료 준비와 승인 후 브리핑 생성. 자세한 논리 구조는 같은 이름의 Mermaid 파일에 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626262"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="60" y="74" font-size="40" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">D와 E는 원문 대조를 준비하고 브리핑을 새로 생성합니다</tspan></text><text x="60" y="124" font-size="23" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">2026-10-05 검증본 · 실시간 재조회나 사전 생성 답안 재생과 구분</tspan></text><text x="60" y="203" font-size="28" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">사전 준비</tspan></text><rect x="60" y="235" width="420" height="195" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="278" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">공식 자료 수집</tspan></text><text x="84" y="322" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">D: 대표이사·직원·보수</tspan><tspan x="84" dy="35">E: 두 회사 × 5개년 보고서</tspan><tspan x="84" dy="35">OpenDART API + 원문</tspan></text><rect x="590" y="235" width="420" height="195" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="614" y="278" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="614" dy="0">표 추출과 의미 대조</tspan></text><text x="614" y="322" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="614" dy="0">정정 후 표 · 단위 · 정의</tspan><tspan x="614" dy="35">같은 보고서 전기 비교액</tspan><tspan x="614" dy="35">E 사업 매출 35개 행</tspan></text><rect x="1120" y="235" width="420" height="195" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="1144" y="278" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="1144" dy="0">공식 저장 원자료</tspan></text><text x="1144" y="322" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="1144" dy="0">접수번호 · 원문 위치</tspan><tspan x="1144" dy="35">확보 시각 · 버전 · 검증</tspan><tspan x="1144" dy="35">회사별 사업 분류 보존</tspan></text><polyline points="480,330 590,330" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1010,330 1120,330" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="60" y="511" font-size="28" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">참가자 실습</tspan></text><rect x="60" y="550" width="320" height="150" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="593" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">조사 계획 승인</tspan></text><text x="84" y="637" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">저장 자료 사용도 확인</tspan></text><rect x="445" y="550" width="325" height="150" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="469" y="593" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="469" dy="0">코드 계산</tspan></text><text x="469" y="637" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="469" dy="0">비중 · 증가액 · 배율</tspan><tspan x="469" dy="35">동일 조건은 재사용 가능</tspan></text><rect x="835" y="550" width="320" height="150" fill="#EAF0FB" stroke="#B9BEC5" stroke-width="1.5"/><text x="859" y="593" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="859" dy="0">새 Gemini 브리핑</tspan></text><text x="859" y="637" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="859" dy="0">계산 근거와 한계 설명</tspan></text><rect x="1220" y="550" width="320" height="150" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="1244" y="593" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="1244" dy="0">사람의 검토</tspan></text><text x="1244" y="637" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="1244" dy="0">원문 대조 · 수정</tspan><tspan x="1244" dy="35">후속 취재 판단</tspan></text><polyline points="380,630 445,630" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="770,630 835,630" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1155,630 1220,630" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1330,430 1330,470 607,470 607,550" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="60" y="785" font-size="26" font-weight="400" fill="#191919" text-anchor="start"><tspan x="60" dy="0">핵심은 비교 기준을 맞추는 일입니다. 반복 API 호출과 대기를 줄이는 운영 효과도 있습니다.</tspan></text><text x="60" y="842" font-size="23" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">저장 원자료만으로 Gemini 장애를 해결하지는 못합니다. 공식 자료의 해석에는 사람 검토가 남습니다.</tspan></text></g></svg>
