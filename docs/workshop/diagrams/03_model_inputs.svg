<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">일반 응답과 근거 기반 브리핑의 입력 및 시스템 지시 비교</title><desc id="desc">일반 응답과 근거 기반 브리핑의 입력 및 시스템 지시 비교. 자세한 논리 구조는 같은 이름의 Mermaid 파일에 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626262"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="60" y="74" font-size="40" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">두 응답은 같은 조사 범위에서 서로 다른 입력을 받습니다</tspan></text><text x="60" y="124" font-size="23" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">같은 Gemini의 역할·입력·출력 제약 비교 · 챗봇 제품 전체의 성능 평가가 아님</tspan></text><rect x="400" y="180" width="800" height="100" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="424" y="223" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="424" dy="0">공통 사용자 입력: question + approved_conditions</tspan></text><text x="424" y="267" font-size="24" font-weight="400" fill="#191919" text-anchor="start"></text><polyline points="580,280 580,320 390,320 390,355" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1020,280 1020,320 1210,320 1210,355" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="60" y="355" width="660" height="285" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="398" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">일반 응답 · 별도 버튼 호출</tspan></text><text x="84" y="442" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">시스템 지시: 불확실한 수치·출처 생성 금지</tspan><tspan x="84" dy="35">사용자 메시지: 질문 + 승인 조건</tspan><tspan x="84" dy="35">공식 조회값·계산 결과·웹 검색 도구 없음</tspan><tspan x="84" dy="35">출력: text</tspan></text><rect x="880" y="355" width="660" height="285" fill="#EAF0FB" stroke="#B9BEC5" stroke-width="1.5"/><text x="904" y="398" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="904" dy="0">근거 기반 브리핑</tspan></text><text x="904" y="442" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="904" dy="0">시스템 지시: 제공 근거만 · 계산 금지 · 인용</tspan><tspan x="904" dy="35">사용자 메시지: 공통 입력 + facts + caveats</tspan><tspan x="904" dy="35">자료 방식·조사 방법도 전달</tspan><tspan x="904" dy="35">출력: 요약 · 발견 · 한계 · 후속 취재</tspan></text><polyline points="1210,640 1210,690" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="880" y="690" width="660" height="100" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="904" y="733" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="904" dy="0">코드 검사 → 근거 ID · 숫자 슬롯 → 화면 표시</tspan></text><text x="904" y="777" font-size="24" font-weight="400" fill="#191919" text-anchor="start"></text><text x="60" y="724" font-size="25" font-weight="400" fill="#191919" text-anchor="start"><tspan x="60" dy="0">approved_conditions는 앱이 정한 필드명입니다.</tspan></text><text x="60" y="772" font-size="24" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">자료원 이름이 있다고 API가 호출되지는 않습니다.</tspan></text><text x="60" y="850" font-size="22" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">근거 브리핑에만 검증된 사실 입력과 인용 제약이 추가됩니다. 일반 응답도 맞거나 모른다고 답할 수 있습니다.</tspan></text></g></svg>
