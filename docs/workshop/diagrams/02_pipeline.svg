<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc"><title id="title">참가자 화면 순서와 승인 및 별도 일반 응답 호출</title><desc id="desc">참가자 화면 순서와 승인 및 별도 일반 응답 호출. 자세한 논리 구조는 같은 이름의 Mermaid 파일에 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626262"/></marker></defs><rect width="1600" height="900" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="60" y="74" font-size="40" font-weight="700" fill="#191919" text-anchor="start"><tspan x="60" dy="0">화면에서 읽는 순서와 서버가 실행하는 순서를 구분합니다</tspan></text><text x="60" y="124" font-size="23" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">2부의 새 조사 사례 · 계획 승인 뒤에만 조회·계산·브리핑 실행</tspan></text><rect x="60" y="195" width="400" height="145" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="238" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">01 취재 질문하기</tspan></text><text x="84" y="282" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">질문과 필요한 확인 답변</tspan></text><rect x="600" y="195" width="400" height="145" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="624" y="238" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="624" dy="0">02 조사 계획 검토</tspan></text><text x="624" y="282" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="624" dy="0">조건 · 자료 방식 · 사람 승인</tspan></text><rect x="1140" y="195" width="400" height="145" fill="#EAF0FB" stroke="#B9BEC5" stroke-width="1.5"/><text x="1164" y="238" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="1164" dy="0">브리핑 작성 중</tspan></text><text x="1164" y="282" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="1164" dy="0">자료 조회 → 계산 → Gemini</tspan></text><polyline points="460,265 600,265" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="478" y="242" font-size="21" font-weight="400" fill="#191919" text-anchor="start"><tspan x="478" dy="0">계획 제안</tspan></text><polyline points="1000,265 1140,265" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1018" y="242" font-size="21" font-weight="400" fill="#235CBB" text-anchor="start"><tspan x="1018" dy="0">승인 후</tspan></text><polyline points="1340,340 1340,420 220,420 220,490" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="60" y="490" width="320" height="165" fill="#EAF0FB" stroke="#B9BEC5" stroke-width="1.5"/><text x="84" y="533" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="84" dy="0">03 응답 비교</tspan></text><text x="84" y="577" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="84" dy="0">근거 브리핑 먼저 표시</tspan><tspan x="84" dy="35">일반 응답은 버튼 호출</tspan></text><rect x="445" y="490" width="325" height="165" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="469" y="533" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="469" dy="0">발견을 뒷받침하는 비교</tspan></text><text x="469" y="577" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="469" dy="0">비교표 · 순위 · 비중</tspan><tspan x="469" dy="35">표 열기는 새 호출 아님</tspan></text><rect x="835" y="490" width="320" height="165" fill="#F4F4F4" stroke="#B9BEC5" stroke-width="1.5"/><text x="859" y="533" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="859" dy="0">04 자료와 계산 근거</tspan></text><text x="859" y="577" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="859" dy="0">원문 · 단위 · 식 · 시각</tspan><tspan x="859" dy="35">실행 기록과 상세 보기</tspan></text><rect x="1220" y="490" width="320" height="165" fill="#E5F0EB" stroke="#B9BEC5" stroke-width="1.5"/><text x="1244" y="533" font-size="27" font-weight="700" fill="#191919" text-anchor="start"><tspan x="1244" dy="0">05 사람 검토와 수정</tspan></text><text x="1244" y="577" font-size="24" font-weight="400" fill="#191919" text-anchor="start"><tspan x="1244" dy="0">사실 · 해석 · 후속 질문</tspan><tspan x="1244" dy="35">수정 초안과 기록 저장</tspan></text><polyline points="380,570 445,570" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="770,570 835,570" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="1155,570 1220,570" fill="none" stroke="#626262" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="60" y="730" font-size="26" font-weight="400" fill="#191919" text-anchor="start"><tspan x="60" dy="0">일반 응답 비교는 별도 Gemini 호출입니다. 근거·표·검토 폼을 펼치는 일은 추가 호출이 아닙니다.</tspan></text><text x="60" y="789" font-size="24" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">계획이 모호하면 질답으로 돌아갑니다. 질문·조건 변경과 재조회는 결과·검토를 초기화합니다.</tspan></text><text x="60" y="842" font-size="24" font-weight="400" fill="#626262" text-anchor="start"><tspan x="60" dy="0">검토 기록 내려받기 → 원문 대조와 후속 취재에 활용 · 자동 기사 작성·발행 없음</tspan></text></g></svg>
